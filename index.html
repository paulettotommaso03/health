<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<meta name="theme-color" content="#F8FAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1511" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<title>Health Dashboard</title>
<style>
:root{--bg:#F8FAF8;--surface:#FFFFFF;--ink:#111613;--ink-3:#717972;--line:#E1E3E1;--primary:#083720;--on-primary:#FFFFFF;--bad:#B3261E}
@media (prefers-color-scheme: dark){:root{--bg:#0E1511;--surface:#18201B;--ink:#E3E8E3;--ink-3:#8C958D;--line:#2B342E;--primary:#BEEECC;--on-primary:#0E1511;--bad:#F2B8B5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px}
form[hidden]{display:none}
h1{margin:0 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 20px;color:var(--ink-3);font-size:14px}
input,button{width:100%;font:inherit;border-radius:14px;padding:13px 14px}
input{border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px}
input:focus{outline:2px solid var(--primary);outline-offset:1px}
button{border:0;background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#e{margin:12px 0 0;min-height:1.4em;color:var(--bad)}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Health Dashboard</h1>
  <p>Garmin e Renpho, aggiornata dal Mac.</p>
  <input type="text" name="username" value="health" autocomplete="username" hidden>
  <input type="password" id="p" name="password" autocomplete="current-password" placeholder="Password" required>
  <button id="b">Apri</button>
  <p id="e" role="status"></p>
</form>

  const K = 'hd-key';
  const $ = id => document.getElementById(id);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const hex = a => Array.from(a, x => x.toString(16).padStart(2, '0')).join('');
  const unhex = s => Uint8Array.from(s.match(/../g) || [], h => parseInt(h, 16));
  const store = {
    get() { try { return localStorage.getItem(K) } catch { return null } },
    set(v) { try { v ? localStorage.setItem(K, v) : localStorage.removeItem(K) } catch {} },
  };
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(D.salt), iterations: D.iter }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct)));
  }
  function show(html) { document.open(); document.write(html); document.close() }
  function ask(msg = '') { $('f').hidden = false; $('e').textContent = msg; $('p').focus() }

  $('f').addEventListener('submit', async ev => {
    ev.preventDefault(); $('b').disabled = true; $('e').textContent = 'Apro…';
    const raw = await derive($('p').value);
    let html;
    try { html = await decrypt(raw) } catch { $('b').disabled = false; $('p').select(); return ask('Password errata') }
    store.set(hex(raw)); show(html);
  });

  const saved = store.get();  // la chiave ricordata vale finché non cambia la password
  if (saved) decrypt(unhex(saved)).then(show, () => { store.set(null); ask() });
  else ask();
})();
